<?xml version="1.0" encoding="UTF-8"?>
<!-- Plaque gravée SENTINEL-X — 80 x 50 mm. Noir = gravure (fill), rouge = découpe (stroke).
     Convertir les textes en chemins dans Inkscape (Chemin > Objet en chemin) avant export si
     la police n'est pas installée sur le poste laser. -->
<svg xmlns="http://www.w3.org/2000/svg" width="80mm" height="50mm" viewBox="0 0 80 50">
  <defs>
    <style>
      .cut { fill: none; stroke: #ff0000; stroke-width: 0.1; }
      .eng { fill: #000000; stroke: none; }
      .txt { font-family: 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #000000; }
    </style>
  </defs>

  <!-- DÉCOUPE : contour arrondi + 4 trous M3 -->
  <g id="decoupe">
    <rect class="cut" x="0.5" y="0.5" width="79" height="49" rx="3" ry="3"/>
    <circle class="cut" cx="4" cy="4" r="1.6"/>
    <circle class="cut" cx="76" cy="4" r="1.6"/>
    <circle class="cut" cx="4" cy="46" r="1.6"/>
    <circle class="cut" cx="76" cy="46" r="1.6"/>
  </g>

  <!-- GRAVURE -->
  <g id="gravure">
    <!-- Logo AetherCorp : hexagone + A stylisé -->
    <polygon class="eng" points="12,5.5 18.5,9.25 18.5,16.75 12,20.5 5.5,16.75 5.5,9.25"/>
    <polygon points="12,8 16,18 14.3,18 13.3,15.4 10.7,15.4 9.7,18 8,18" fill="#ffffff"/>
    <polygon points="12,10.8 13.1,13.9 10.9,13.9" fill="#000000"/>

    <text class="txt" x="22" y="11.5" font-size="5.2" font-weight="bold">AetherCorp</text>
    <text class="txt" x="22" y="16" font-size="2.6" letter-spacing="0.4">INDUSTRIAL SOLUTIONS</text>

    <rect class="eng" x="5.5" y="22.5" width="69" height="0.5"/>

    <text class="txt" x="40" y="30.5" font-size="6.5" font-weight="bold" text-anchor="middle" letter-spacing="0.8">SENTINEL-X</text>
    <text class="txt" x="40" y="34.5" font-size="2.4" text-anchor="middle" letter-spacing="0.5">EDGE NODE  ·  S/N SX-G1-01  ·  FW 0.1</text>

    <rect class="eng" x="5.5" y="37" width="69" height="0.4"/>

    <!-- Pictogrammes sécurité : triangle éclair, triangle chaleur -->
    <polygon class="eng" points="9,39.5 12.5,45.5 5.5,45.5"/>
    <polygon points="9.4,40.8 7.8,43.3 9.1,43.3 8.4,45 10.3,42.4 9,42.4" fill="#ffffff"/>
    <text class="txt" x="14" y="42" font-size="2.2" font-weight="bold">7.5 V DC · 1 A</text>
    <text class="txt" x="14" y="45" font-size="1.9">Ne pas ouvrir sous tension</text>

    <polygon class="eng" points="48,39.5 51.5,45.5 44.5,45.5"/>
    <path d="M47.2,44.6 q0.4,-1.2 0,-2 q0.6,0.4 0.9,1.2 q0.3,-0.4 0.2,-1 q0.9,0.8 0.7,1.8 q-0.2,1 -1.2,1 q-1,0 -0.6,-1 z" fill="#ffffff"/>
    <text class="txt" x="53" y="42" font-size="2.2" font-weight="bold">Surface chaude</text>
    <text class="txt" x="53" y="45" font-size="1.9">Groupe 1 · EPSI 2026</text>
  </g>
</svg>
