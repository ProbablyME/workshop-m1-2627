# Mosquitto - Sentinel-X Groupe 1
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice

# Authentification obligatoire sur tous les listeners
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Listener 1 : MQTT en clair (dev / debug uniquement) ---
listener 1883
protocol mqtt

# --- Listener 2 : MQTTS (TLS) pour l'ESP8266 ---
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# require_certificate false : l'ESP vérifie le serveur (CA ou fingerprint),
# le serveur authentifie l'ESP par login/mot de passe.
require_certificate false

# Limites anti-flood (MCO : protège la machine hôte lors du pentest)
max_connections 50
max_inflight_messages 20
max_queued_messages 1000
max_packet_size 4096
